name: build-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-22.04      # old glibc = runs on Ubuntu 22.04+, Debian 12+, Mint 21+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libpulse0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name vibebeat --add-data "icon.png:." main.py
      - name: Build .deb
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          chmod +x build_deb.sh
          ./build_deb.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name vibebeat --icon icon.ico --add-data "icon.png;." main.py
      - run: Compress-Archive -Path dist/vibebeat/* -DestinationPath vibebeat-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vibebeat-windows.zip

  release:
    needs: [deb, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VibeBeat ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
