name: build-release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-22.04      # old glibc: runs on Ubuntu 22.04+, Debian 12+, Mint 21+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libpulse0 libasound2 libdbus-1-3 \
            libfontconfig1 libffi-dev
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --windowed --name vibebeat
          --add-data "icon.png:." --collect-all miniaudio
          --hidden-import _miniaudio main.py
      - name: Build .deb
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          chmod +x build_deb.sh
          ./build_deb.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --windowed --name vibebeat
          --icon icon.ico --add-data "icon.png;." --collect-all miniaudio
          --hidden-import _miniaudio main.py
      - run: Compress-Archive -Path dist/vibebeat/* -DestinationPath vibebeat-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vibebeat-windows.zip

  release:
    needs: [deb, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VibeBeat ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*

  apt-repo:
    needs: deb
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: apt-repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: debs
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg
      - name: Import signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "FPR=$FPR" >> "$GITHUB_ENV"
      - name: Build and sign the repository
        run: |
          cd site
          mkdir -p pool/main dists/stable/main/binary-amd64
          cp ../debs/*.deb pool/main/
          rm -f dists/stable/Release dists/stable/InRelease dists/stable/Release.gpg
          dpkg-scanpackages -m --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k -f dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=VibeBeat \
            -o APT::FTPArchive::Release::Label=VibeBeat \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > /tmp/Release
          mv /tmp/Release dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$FPR" \
            --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --default-key "$FPR" \
            --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --export "$FPR" > vibebeat.gpg
          gpg --armor --export "$FPR" > vibebeat.asc
          touch .nojekyll
      - name: Publish to gh-pages
        run: |
          cd site
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "APT repo: ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin gh-pages
